  - id: techno-peak
    name: Techno (peak-time / driving)
    family: global
    bpm: [128, 145]
    energy: [8, 10]
    feel: [relentless, hypnotic, hard]
    subgenres: [peak-time, driving, hard-groove]
    neighbors:
