# =============================================================================
# NEXTRACK — GENRE GRAPH
# =============================================================================
# Genres are NODES. Edges (`neighbors`) describe how to travel between them:
# the BPM path, the rhythmic/harmonic bridge, and how reliable the move is.
# This is the navigation map — the track catalog is a separate, unordered pool.
#
# Node schema:
#   id:         kebab-case, stable, referenced by tracks (`genre: <id>`)
#   name:       human label
#   family:     brazilian | global
#   bpm:        [min, max] typical
#   energy:     [min, max] on the 1-10 scale (see docs/energy-arcs.md)
#   feel:       short mood tags
#   subgenres:  finer detail within the node
#   neighbors:  edges — how to move OUT of this node
#     to:       target node id
#     strength: strong | medium | weak   (how reliably it works)
#     via:      the technique/bridge that makes the move work
#
# Edges are directional here for clarity but most are two-way in practice.
# This is a STARTING map — refine strengths and add edges as you learn the room.
# Visualize it in docs/genre-graph.md (Mermaid).
# =============================================================================

nodes:

  # --------------------------- BRAZILIAN --------------------------------------

  - id: brazilian-funk
    name: Funk (carioca / mandelão)
    family: brazilian
    bpm: [125, 160]
    energy: [6, 10]
    feel: [peak, rhythmic, vocal]
    subgenres: [funk-130, funk-150-mandelao, brega-funk, funk-melody, rasteirinha]
    neighbors:
      - {to: global-bass,     strength: strong, via: "shared rhythmic DNA; match dembow/baile groove"}
      - {to: afro-house,      strength: medium, via: "double/half-time (150 <-> ~122); ride the percussion"}
      - {to: brazilian-bass,  strength: medium, via: "drop to ~126; keep BR identity, smooth the low end"}
      - {to: afro-brasileiro, strength: strong, via: "percussion bridge; a BR-native cooldown from peak"}
      - {to: axe,             strength: strong, via: "drop to the axé party; echo out or hard cut"}
      - {to: pop-dance,       strength: medium, via: "throwback crossover; hard cut on the hook"}
      - {to: funk-pop,        strength: strong, via: "same funk base gone commercial; play the hook"}
      - {to: funk-anos-2000,  strength: strong, via: "same family, retro; nostalgia moment"}

  - id: brazilian-bass
    name: Brazilian Bass
    family: brazilian
    bpm: [120, 128]
    energy: [5, 8]
    feel: [melodic, driving, radio-friendly]
    subgenres: [festival, deep-brazilian-bass]
    neighbors:
      - {to: tech-house,           strength: strong, via: "same tempo band; swap bassline for groove"}
      - {to: melodic-house-techno, strength: strong, via: "lift the melody, build energy"}
      - {to: deep-house,           strength: medium, via: "ease down in energy, keep the groove"}
      - {to: brazilian-funk,       strength: medium, via: "inject BR identity for a peak moment"}
      - {to: tech-house-br,        strength: strong, via: "BR house sibling; blend"}

  - id: afro-brasileiro
    name: Afro-Brasileiro
    family: brazilian
    bpm: [118, 125]
    energy: [5, 8]
    feel: [percussive, hypnotic, warm]
    subgenres: [afro-batuque, berimbau-house, organic-br]
    neighbors:
      - {to: afro-house,      strength: strong, via: "near-identical tempo/feel; global<->BR percussion"}
      - {to: organic-house,   strength: strong, via: "soften percussion, keep texture"}
      - {to: amapiano,        strength: medium, via: "drop tempo, lean into log-drum space"}
      - {to: samba-pagode,    strength: medium, via: "acoustic percussion bridge for an identity moment"}

  - id: samba-pagode
    name: Samba / Pagode
    family: brazilian
    bpm: [95, 105]
    energy: [4, 7]
    feel: [joyful, swung, vocal]
    subgenres: [samba, pagode, samba-rock, samba-house, roda-eletronica]
    neighbors:
      - {to: afro-brasileiro, strength: medium, via: "electronic edit; ramp tempo into afro percussion"}
      - {to: nu-disco-funk,   strength: medium, via: "shared swing/groove; vocal crossover"}
      - {to: mpb-bossa,       strength: strong, via: "acoustic/melodic cooldown, same lineage"}
      - {to: axe,             strength: strong, via: "baiano party lift; ramp tempo or hard cut"}

  - id: forro-piseiro
    name: Forró / Piseiro
    family: brazilian
    bpm: [120, 140]
    energy: [5, 8]
    feel: [danceable, romantic, regional]
    subgenres: [forro-eletronico, piseiro, arrocha, forro-pe-de-serra]
    neighbors:
      - {to: sertanejo,       strength: strong, via: "adjacent crowd + singalong energy"}
      - {to: brazilian-funk,  strength: medium, via: "regional crossover; lift to peak"}
      - {to: samba-pagode,    strength: weak,   via: "acoustic/party bridge, watch the tempo gap"}
      - {to: axe,             strength: medium, via: "NE party crossover; keep the singalong"}

  - id: sertanejo
    name: Sertanejo
    family: brazilian
    bpm: [120, 160]
    energy: [3, 7]
    feel: [singalong, romantic, crowd-moment]
    subgenres: [universitario, sofrencia, agronejo]
    neighbors:
      - {to: forro-piseiro,   strength: strong, via: "shared audience; keep the party going"}
      - {to: mpb-bossa,       strength: medium, via: "slow it to a warm singalong cooldown"}

  - id: mpb-bossa
    name: MPB / Bossa / Tecnobrega
    family: brazilian
    bpm: [90, 115]
    energy: [2, 5]
    feel: [warm, nostalgic, melodic]
    subgenres: [mpb, bossa-nova, tropicalia, tecnobrega, brega]
    neighbors:
      - {to: organic-house,   strength: strong, via: "downtempo electronic reinterpretation; warmup"}
      - {to: samba-pagode,    strength: strong, via: "same lineage, lift the swing"}
      - {to: amapiano,        strength: weak,   via: "spacious, patient bridge upward"}

  # ----------------------------- GLOBAL ---------------------------------------

