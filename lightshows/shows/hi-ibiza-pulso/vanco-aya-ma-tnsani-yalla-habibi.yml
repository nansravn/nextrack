track: Vanco, Aya — Ma Tnsani (Yalla Habibi)
story: >-
  Ma Tnsani entra cantando por baixo do Baianá. A chegada desce em filas, uma Vorlane de cada
  vez; no break a voz de Aya fica com a sala quase escura, e o drop final cai em ciano.
budget: >-
  Nenhum efeito raro.
cues:
  - at: 18
    name: groove-aberto
    intent: 'O groove sem a ponte: feixes varrendo devagar entre as colunas, colunas de matriz acendendo a cada compasso, coração pulsando baixo.'
    look:
      movers: {move: sweep, every: 4bar, positions: [coluna, cruzado], colour: azul-gelo, level: 0.45}
      matrix: {draw: columns, rate: 1bar, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: break.1
    name: grave-some
    intent: 'O grave some e o kick cai: feixes parados nas colunas, colunas de matriz devagar, o coração apagado.'
    look:
      movers: {move: hold, position: coluna, colour: azul-gelo, level: 0.4}
      matrix: {draw: columns, rate: 1bar, colour: azul-profundo, mirror: true}
      hue: dark
  - at: 27
    name: voz-cresce
    intent: 'A voz cresce: os feixes parados olham para cima, a matriz enche a cada compasso, o coração segue apagado até a chegada.'
    look:
      movers: {move: hold, position: Up, colour: azul-gelo, level: 0.3}
      matrix: {draw: fill-up, rate: 2bar, colour: azul-profundo, mirror: true}
      hue: dark
  - at: drop.1
    name: chegada
    role: arrival
    intent: 'A chegada: filas descendo, NW e SW alternando; movings revezando.'
    look:
      movers: {move: pingpong, every: 1/2, colour: azul-gelo, position: Dance Floor Centre}
      matrix: {draw: rows-down, rate: 1/4, colour: azul-profundo, pingpong: true}
      hue: {state: pulse, colour: carmim}
  - at: break.2
    name: break-cantado
    intent: 'A voz no break: filas subindo devagar, um feixe para cima, centro escuro.'
    look:
      movers: {move: hold, position: Up, colour: azul-gelo, level: 0.5}
      matrix: {draw: rows-up, rate: 1bar, colour: azul-profundo, mirror: true}
      hue: dark
  - at: 76
    name: o-grave-volta
    intent: 'O grave volta antes do kick: filas caindo rápido em ciano, o coração volta.'
    look:
      movers: {move: pingpong, every: 1/4, colour: azul-gelo, position: Crossed Over}
      matrix: {draw: rows-down, rate: 1/8, colour: ciano, pingpong: true}
      hue: {state: pulse, colour: carmim}
handover:
  look: respiracao-azul
  until: 87
