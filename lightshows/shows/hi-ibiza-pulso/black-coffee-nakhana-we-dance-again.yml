track: Black Coffee, Nakhana — We Dance Again
story: >-
  We Dance Again não tem drop: o kick nunca para. A chegada é o grave entrando no c. 56, e a luz
  responde com o batimento: as Vorlanes batem em azul, um lado de cada vez, como um coração.
  Quando a voz volta, os feixes sobem com ela.
budget: >-
  Nenhum efeito raro. O desenho `solid` alternando lados é o batimento da noite em azul.
cues:
  - at: 37
    name: voz-sem-grave
    intent: 'O grave sai e a voz da Nakhana fica sobre o kick: os feixes varrem devagar da poça ao leque, e as Vorlanes enchem de baixo para cima a meio tempo.'
    look:
      movers: {move: sweep, every: 4bar, positions: [Down, leque], colour: azul-gelo, level: 0.55}
      matrix: {draw: fill-up, rate: 1/2, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 43
    name: voz-contida
    intent: 'Só o kick e a voz: os feixes se alternam entre a coluna e o varal, e as Vorlanes marcam colunas azuis, uma por compasso, enquanto o lustre carmim segura o batimento.'
    look:
      movers: {move: pingpong, every: 2bar, positions: [Up, varal], colour: azul-gelo, level: 0.5}
      matrix: {draw: columns, rate: 1bar, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 51
    name: voz-guarda
    intent: 'A voz sustenta e os feixes param baixos, na poça, contidos; as filas azuis descem a meio tempo, guardando o batimento.'
    look:
      movers: {move: hold, position: Down, colour: azul-gelo, level: 0.6}
      matrix: {draw: rows-down, rate: 1/2, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 56
    name: chegada-o-grave
    role: arrival
    intent: 'O grave entra: as Vorlanes batem a cada tempo, NW e SW alternando, como um coração.'
    look:
      movers: {move: hold, position: Dance Floor Centre, colour: azul-gelo, level: 0.8}
      matrix: {draw: solid, rate: 1/4, colour: azul-profundo, pingpong: true}
      hue: {state: pulse, colour: carmim}
  - at: 72
    name: a-voz
    intent: 'A voz volta e os feixes sobem com ela; as filas sobem no tempo.'
    look:
      movers: {move: sweep, every: 2bar, positions: [Up, Dance Floor Centre], colour: azul-gelo, level: 0.7}
      matrix: {draw: rows-up, rate: 1/4, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 104
    name: brilho
    intent: 'Ciano nas colunas, as movings revezando: a água brilha antes da entrega.'
    look:
      movers: {move: pingpong, every: 1/2, colour: azul-gelo, position: Dance Floor Centre}
      matrix: {draw: columns, rate: 1/4, colour: ciano, mirror: true}
      hue: {state: pulse, colour: carmim}
handover:
  look: respiracao-azul
  until: 128
