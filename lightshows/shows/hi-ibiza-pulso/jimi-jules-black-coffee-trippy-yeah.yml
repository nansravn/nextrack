track: Jimi Jules, Black Coffee — Trippy Yeah
story: >-
  Trippy Yeah é a viagem: quando o We Dance Again sai, a sala escurece, um compasso de breu, e o
  drop solta um zigue-zague espelhado, um ponto correndo pelas duas Vorlanes. No break a sala
  volta a ser só feixe, e o segundo drop repete a viagem mais rápido.
budget: >-
  Breu 2 de 5 (c. 32). Sem fita branca e sem estrobo.
cues:
  - at: B + 16
    name: break-recolhido
    intent: 'O grave sai e o kick baixa: um feixe só na coluna, baixo, e o carmim marcando o pulso; o centro apagado.'
    look:
      movers: {move: hold, position: coluna, colour: azul-gelo, level: 0.3}
      matrix: off
      hue: {state: pulse, colour: carmim}
  - at: 24
    name: voz-recolhida
    intent: 'A voz entra: as Vorlanes acendem baixas, uma seta subindo devagar em azul-profundo, o feixe segue parado na coluna.'
    look:
      movers: {move: hold, position: coluna, colour: azul-gelo, level: 0.5}
      matrix: {draw: arrow-up, rate: 1/2, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 28
    name: subida
    intent: 'O We Dance Again saiu: o centro apaga e as Vorlanes enchem em quatro compassos.'
    look:
      movers: off
      matrix: {draw: fill-up, rate: 1/4, colour: azul-profundo, mirror: true}
      hue: dark
  - at: drop.1 - 1
    name: breu
    intent: 'Um compasso de breu: o grave volta sozinho, a luz espera o kick.'
    look: breu
  - at: drop.1
    name: chegada
    role: arrival
    intent: 'A chegada com o kick: zigue-zague espelhado, um ponto correndo pelas Vorlanes; movings revezando.'
    look:
      movers: {move: pingpong, every: 1/4, colour: azul-gelo, position: Dance Floor Centre}
      matrix: {draw: zigzag, rate: 1/8, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 48
    name: a-voz
    intent: 'A voz: o zigue-zague desacelera em ciano, os feixes sobem.'
    look:
      movers: {move: sweep, every: 2bar, positions: [Up, Crossed Over], colour: azul-gelo, level: 0.7}
      matrix: {draw: zigzag, rate: 1/4, colour: ciano, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 64
    name: groove
    intent: 'Groove: filas subindo e as movings revezando.'
    look:
      movers: {move: pingpong, every: 1/2, colour: azul-gelo, position: Crossed Over}
      matrix: {draw: rows-up, rate: 1/4, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: break.2
    name: break
    intent: 'Break: só um feixe baixo, o centro escuro.'
    look:
      movers: {move: hold, position: Down, colour: azul-gelo, level: 0.4}
      matrix: off
      hue: dark
  - at: build.2
    name: subida
    intent: 'Três compassos enchendo, as movings acelerando.'
    look:
      movers: {move: pingpong, every: 1/2, colour: azul-gelo, faster_from: 92, faster_every: 1/8, position: Up}
      matrix: {draw: fill-up, rate: 1/4, colour: azul-profundo, mirror: true}
      hue: dark
  - at: drop.2
    name: drop-2
    intent: 'O segundo drop: o zigue-zague volta mais rápido.'
    look:
      movers: {move: pingpong, every: 1/4, colour: azul-gelo, position: Dance Floor Centre}
      matrix: {draw: zigzag, rate: 1/16, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
handover:
  look: respiracao-azul
  until: 114
