track: PAWSA — Too Cool To Be Careless
story: >-
  TOO COOL é a virada da noite, do afro para o tech. Entra inteiro por baixo do Move; quando o
  grave volta do filtro, o vermelho já bate no centro. Na subida filtrada a segunda espiral
  acelera até 1/16, um compasso de breu, e o drop do c. 49 é o momento da noite: primeiro
  estrobo, a fita branca, as Vorlanes inteiras batendo em vermelho como um coração disparado.
budget: >-
  A virada gasta o que o plano guardou para ela: espiral 2 de 3 (c. 41-47), breu 4 de 5 (c. 48),
  o primeiro estrobo (49.1) e a fita branca (49.1). Única música com os três.
cues:
  - at: break.1
    name: filtro
    intent: 'O grave some no filtro: filas violetas subindo devagar, um feixe para cima, centro escuro.'
    look:
      movers: {move: hold, position: Up, colour: violeta, level: 0.4}
      matrix: {draw: rows-up, rate: 1bar, colour: violeta, mirror: true}
      hue: dark
  - at: 21
    name: o-kick-volta
    intent: 'O kick volta, o grave ainda filtrado: colunas violetas, o coração em vermelho vivo.'
    look:
      movers: {move: pingpong, every: 1/2, colour: azul-gelo, position: Dance Floor Centre}
      matrix: {draw: columns, rate: 1/4, colour: violeta, mirror: true}
      hue: {state: pulse, colour: vermelho}
  - at: drop.1
    name: too-cool
    role: arrival
    intent: 'Too cool: feixes varrendo a pista, filas azuis subindo, o coração vermelho.'
    look:
      movers: {move: sweep, every: 2bar, positions: [Dance Floor Centre, Crossed Over], colour: azul-gelo, level: 0.8}
      matrix: {draw: rows-up, rate: 1/4, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: vermelho}
  - at: 41
    name: espiral
    intent: 'Espiral da virada: os lados revezam cada vez mais rápido, do azul ao vermelho.'
    gesture: spiral
    with: {bars: [2, 2, 2, 1]}
  - at: drop.2 - 1
    name: breu
    intent: 'Um compasso de breu total.'
    look: breu
  - at: drop.2
    name: virada
    moment: virada
    accents: [white, strobe]
    intent: 'A virada: primeiro estrobo e a fita branca no 1; as Vorlanes inteiras batendo em vermelho a cada 1/8, as movings piscando.'
    look:
      movers: {move: blink, every: 1/4, colour: vermelho, position: Crossed Over}
      matrix: {draw: solid, rate: 1/8, colour: vermelho}
      hue: {state: pulse, colour: vermelho}
  - at: 57
    name: pico-1
    intent: 'Depois da virada: filas caindo espelhadas em azul, as movings em vermelho revezando.'
    look:
      movers: {move: pingpong, every: 1/4, colour: vermelho, position: Dance Floor Centre}
      matrix: {draw: rows-down, rate: 1/8, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: vermelho}
  - at: 73
    name: pico-2
    intent: 'Colunas vermelhas alternando NW e SW, feixes azuis revezando.'
    look:
      movers: {move: pingpong, every: 1/4, colour: azul-gelo, position: Crossed Over}
      matrix: {draw: columns, rate: 1/8, colour: vermelho, pingpong: true}
      hue: {state: pulse, colour: vermelho}
handover:
  look: pulso-vermelho
  until: outro.1
