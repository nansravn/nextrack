track: Caiiro — The Akan
story: >-
  O Akan entra por baixo da Rapture, na mesma respiração azul. Quando a Rapture acaba, o Akan
  quebra: a sala escurece e as Vorlanes enchem. A chegada é tribal: colunas em ciano, a primeira
  água da noite, e as movings revezando com a percussão.
budget: >-
  Nenhum efeito raro: o Akan é o transe que segura a sala depois da abertura.
cues:
  - at: 73
    name: groove-cheio
    intent: 'O Akan toma a sala com o groove cheio: as movings alternam no ritmo de um compasso, as Vorlanes em zigue-zague azul e o coração carmim batendo.'
    look:
      movers: {move: pingpong, every: 1bar, position: Crossed Over, colour: azul-gelo, level: 0.8}
      matrix: {draw: zigzag, rate: 1/2, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 77
    name: a-voz-aparece
    intent: 'A voz entra sobre o groove: as movings baixam e se juntam no centro, as Vorlanes sobem em filas lentas.'
    look:
      movers: {move: hold, position: Dance Floor Centre, colour: azul-gelo, level: 0.5}
      matrix: {draw: rows-up, rate: 1bar, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 81
    name: groove-cheio-volta
    intent: 'A voz sai e o groove cheio volta: movings alternando, zigue-zague azul, coração carmim.'
    look:
      movers: {move: pingpong, every: 1bar, position: Crossed Over, colour: azul-gelo, level: 0.8}
      matrix: {draw: zigzag, rate: 1/2, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 93
    name: a-voz-antes-do-break
    intent: 'A voz volta antes do break: as movings se juntam no centro e as Vorlanes sobem devagar.'
    look:
      movers: {move: hold, position: Dance Floor Centre, colour: azul-gelo, level: 0.5}
      matrix: {draw: rows-up, rate: 1bar, colour: azul-profundo, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: break.1
    name: break
    intent: 'Quando a Rapture sai: o centro apaga, um feixe baixo para cima, Vorlanes desligadas.'
    look:
      movers: {move: hold, position: Up, colour: azul-gelo, level: 0.3}
      matrix: off
      hue: dark
  - at: 101
    name: subida
    intent: 'Quatro compassos enchendo as Vorlanes, as movings acelerando.'
    look:
      movers: {move: pingpong, every: 1/2, colour: azul-gelo, position: Up}
      matrix: {draw: fill-up, rate: 1/2, colour: azul-profundo, mirror: true}
      hue: dark
  - at: drop.1
    name: chegada
    role: arrival
    intent: 'A chegada do Akan: colunas em ciano andando pelas paredes, os cantos respondem.'
    look:
      movers: {move: pingpong, every: 1/4, colour: azul-gelo, position: Dance Floor Centre}
      matrix: {draw: columns, rate: 1/8, colour: ciano, mirror: true}
      hue: {state: pulse, colour: carmim}
  - at: 121
    name: groove-tribal
    intent: 'O groove tribal: colunas azuis alternando NW e SW, feixes varrendo de um lado ao outro.'
    look:
      movers: {move: sweep, every: 2bar, positions: [Stage Left, Stage Right], colour: azul-gelo, level: 0.7}
      matrix: {draw: columns, rate: 1/4, colour: azul-profundo, pingpong: true}
      hue: {state: pulse, colour: carmim}
handover:
  look: respiracao-azul
