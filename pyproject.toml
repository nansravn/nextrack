[project]
name = "nextrack"
version = "0.1.0"
description = "DJ set planning as code — repo tooling"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.47",
    "numpy>=2.5.4",
    "pyyaml>=6.0",
    "soundfile>=0.14.0",
]

[dependency-groups]
analysis = [
    "demucs>=4.0.1",
    "pyrekordbox>=0.5.0",
    "sqlcipher3-wheels>=0.5.7",
    "torch>=2.15.0",
]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
