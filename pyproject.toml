[project]
name = "nextrack"
version = "0.1.0"
description = "DJ set planning as code — repo tooling"
requires-python = ">=3.12"
dependencies = ["mutagen>=1.47", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
